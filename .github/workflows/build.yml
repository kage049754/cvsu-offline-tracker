name: Build APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Buildozer global dependencies
        uses: actions/cache@v5
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Cache project Buildozer directory
        uses: actions/cache@v5
        with:
          path: .buildozer
          key: buildozer-project-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-project-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            curl \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.33"
          python -m pip install buildozer

      - name: Build APK with retries
        shell: bash
        run: |
          set -o pipefail

          for attempt in 1 2 3 4 5; do
            echo "========================================"
            echo "Build attempt $attempt of 5"
            echo "========================================"

            if yes | buildozer -v android debug; then
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 20))
              echo "Build failed. Retrying in ${delay} seconds..."
              sleep "$delay"
            fi
          done

          echo "Build failed after 5 attempts."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: cvsu-offline-tracker-apk
          path: ./bin/*.apk
