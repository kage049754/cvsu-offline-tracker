name: Build APK

on:
  push:
    branches:
      - main
      - master
      - clean-android-rebuild-2026-09-14
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    env:
      ANDROIDAPI: "34"
      ANDROIDMINAPI: "24"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Buildozer global dependencies
        uses: actions/cache@v5
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-api34-${{ hashFiles('buildozer.spec', 'requirements.txt', '.github/workflows/build.yml') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-api34-

      - name: Cache project Buildozer directory
        uses: actions/cache@v5
        with:
          path: .buildozer
          key: buildozer-project-${{ runner.os }}-api34-${{ hashFiles('buildozer.spec', 'requirements.txt', '.github/workflows/build.yml') }}
          restore-keys: |
            buildozer-project-${{ runner.os }}-api34-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.33" "buildozer==1.5.0"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: cvsu-offline-tracker-apk
          path: ./bin/*.apk
          if-no-files-found: error
